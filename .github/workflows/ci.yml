# Checks every pull request and every push to main: formatting, lint, the packages' builds, typechecks and tests, and
# the docs site's build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node from mise.toml; pnpm 12 to match the lockfile.
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      # Before the typechecks and tests: packages resolve each other through their exports, which point at dist.
      - run: pnpm build
      # The browser test projects run in Chromium. The runner has no GPU, so threejs draws WebGL and WebGPU through
      # SwiftShader (see packages/threejs/vite.config.ts).
      - run: pnpm --filter @solid-slopkit/components exec playwright install --with-deps chromium
      - run: pnpm test
      # The docs site is a real consumer of the built packages: its production build resolves them through their exports.
      - run: pnpm --filter docs build
      # After the docs build: the docs' route types (file-routes.d.ts) are generated by it.
      - run: pnpm typecheck
