# Publishes every package to npm at the version they share, and creates one GitHub Release tagged `v<version>` with each
# package's changelog section as notes (ADR 0028). A release is the commit on main that applies the changesets
# (`pnpm changeset version`); pushing it starts this workflow. Pushes that change no version end after the first job.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "pending=$(node scripts/release-pending.mjs)" >> "$GITHUB_OUTPUT"

  release:
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: the workflow proves its identity with a GitHub OIDC token instead of an npm token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node from mise.toml; pnpm 12 to match the lockfile.
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - run: pnpm install --frozen-lockfile

      - name: One version for every package, with no changesets left unapplied
        run: |
          node -e "import('./scripts/packages.mjs').then((m) => console.log(m.sharedVersion()))"
          if ls .changeset/*.md | grep -v README.md; then
            echo "These changesets are not applied yet: run pnpm changeset version and commit the result"
            exit 1
          fi

      - run: pnpm format:check
      - run: pnpm lint
      # Builds the packages and lists the files npm will publish, in the log.
      - run: pnpm release:check
      # The browser test projects run in Chromium. The runner has no GPU, so threejs draws WebGL and WebGPU through
      # SwiftShader (see packages/threejs/vite.config.ts).
      - run: pnpm --filter @solid-slopkit/components exec playwright install --with-deps chromium
      - run: pnpm test
      # The docs site is a real consumer of the built packages: its production build resolves them through their exports.
      - run: pnpm --filter docs build
      # After the docs build: the docs' route types (file-routes.d.ts) are generated by it.
      - run: pnpm typecheck

      # Publishes the packages as built above. Versions already on npm are skipped, so a rerun after a later step failed
      # doesn't fail here.
      - name: Publish to npm
        run: node scripts/release-publish.mjs

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-github.mjs
