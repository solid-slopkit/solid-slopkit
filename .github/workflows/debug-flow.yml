# TEMPORARY: runs only flow's selection browser tests on Linux, to diagnose a Linux-only failure. Delete before merging.
name: Debug flow

on:
  pull_request:

jobs:
  flow-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solid-slopkit/components build
      - run: pnpm --filter @solid-slopkit/flow exec playwright install --with-deps chromium
      - name: Selection browser tests
        working-directory: packages/flow
        run: npx vitest run --project browser src/selection/ || true
